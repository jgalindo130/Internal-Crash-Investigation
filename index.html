<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Internal Crash Investigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: a crash-report form — boxed cells with small caps labels under dark section bands; the diagram tab is a three-pane drafting table. */
:root{
  --paper:#eceff0; --sheet:#ffffff; --field:#fbfcfc; --ink:#151c20; --muted:#58656d; --rule:#c9d1d5; --rule-strong:#8d989e;
  --accent:#0d6a4b; --accent-ink:#ffffff; --accent-soft:#dcefe6;
  --warn:#9a5b00; --warn-soft:#fdf0d6; --bad:#a3221b; --bad-soft:#fbe2df; --ok:#21734a; --ok-soft:#dff3e7;
  --band:#1f2a30; --band-ink:#f1f4f5; --sub:#e3e8ea;
  --ff:"Overpass","Segoe UI",system-ui,sans-serif; --fm:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1416; --sheet:#171e21; --field:#12181b; --ink:#e4eaec; --muted:#97a6ad; --rule:#2c373c; --rule-strong:#4b5a61;
  --accent:#42b98a; --accent-ink:#06150f; --accent-soft:#163428;
  --warn:#e3a640; --warn-soft:#33270f; --bad:#f07a70; --bad-soft:#3a1916; --ok:#5fcf93; --ok-soft:#14301f;
  --band:#26323a; --band-ink:#e9eef0; --sub:#1f282c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1416; --sheet:#171e21; --field:#12181b; --ink:#e4eaec; --muted:#97a6ad; --rule:#2c373c; --rule-strong:#4b5a61;
  --accent:#42b98a; --accent-ink:#06150f; --accent-soft:#163428;
  --warn:#e3a640; --warn-soft:#33270f; --bad:#f07a70; --bad-soft:#3a1916; --ok:#5fcf93; --ok-soft:#14301f;
  --band:#26323a; --band-ink:#e9eef0; --sub:#1f282c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ff);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-weight:800;letter-spacing:.02em;font-size:15px}
.brand span{font-family:var(--fm);font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .grow{flex:1}
.savestate{font-size:12px;opacity:.85;font-family:var(--fm);white-space:nowrap}
.btn{border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);border-radius:4px;padding:6px 11px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}
.bar .btn.ghost:hover{border-color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 16px;background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,56px));z-index:15;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:11px 12px 9px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;letter-spacing:.02em}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

main{padding-block:18px 60px;padding-inline:16px;max-width:1180px;margin:0 auto}
main.wide{max-width:none;padding-block:0;padding-inline:0}

/* form sheets */
.sheet{background:var(--sheet);border:1px solid var(--rule-strong);margin-bottom:18px}
.band{background:var(--band);color:var(--band-ink);padding:6px 10px;font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.band .grow{flex:1}
.band .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}
.subh{background:var(--sub);padding:5px 10px;font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{border-top:1px solid var(--rule);border-right:1px solid var(--rule);padding:5px 8px 6px;min-width:0;display:flex;flex-direction:column;gap:2px;background:var(--sheet)}
.cell:focus-within{background:var(--accent-soft)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:1/-1}
.cell label,.cell .lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cell input,.cell select,.cell textarea{width:100%;border:0;background:transparent;padding:2px 0;font-size:14px;min-height:26px;border-radius:2px}
.cell input:focus,.cell select:focus,.cell textarea:focus{outline:none}
.cell textarea{resize:vertical;line-height:1.45}
.cell select{appearance:auto;cursor:pointer}
.cell.calc output{font-family:var(--fm);font-weight:600;padding-top:3px}
.cell .hint{text-transform:none;letter-spacing:0;font-weight:400;margin-left:4px}
.mono{font-family:var(--fm)}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:3px 0}
.chip{border:1px solid var(--rule-strong);background:var(--field);border-radius:3px;padding:2px 8px;font-size:12.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.na-row{display:flex;gap:6px;align-items:center}
.na-row input{flex:1;min-width:0}
.na-row input:disabled{opacity:.35}
.na-row .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mlist{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:2px 0}
.mrow{display:flex;align-items:center;gap:6px;width:100%}
.mrow input{flex:1;border-bottom:1px dashed var(--rule)!important}
.mno{font-family:var(--fm);font-size:12px;color:var(--muted);min-width:1.6em}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 18px}

/* determination strip */
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--rule-strong);background:var(--sheet);margin-bottom:18px}
.det>div{padding:10px 12px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:3px;min-width:0}
.det .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.det .v{font-weight:800;font-size:15px}
.det .n{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mut{background:var(--sub);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0 0 18px;max-width:75ch}

/* drawer */
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-start;background:rgba(10,14,16,.45)}
.drawer .panel{background:var(--sheet);width:min(440px,100%);height:100%;overflow:auto;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--rule-strong)}
.drawer h2{margin:0;font-size:16px;font-weight:800}
.caselist{display:flex;flex-direction:column;border:1px solid var(--rule)}
.caserow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-bottom:1px solid var(--rule);text-align:left;background:var(--sheet);border-left:3px solid transparent;width:100%;border-top:0;border-right:0}
.caserow:hover{background:var(--sub)}
.caserow.cur{border-left-color:var(--accent);background:var(--accent-soft)}
.caserow .no{font-family:var(--fm);font-weight:600}
.caserow .meta{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.empty{padding:20px;color:var(--muted);text-align:center}

/* diagram */
.dg{display:grid;grid-template-columns:168px minmax(0,1fr) 290px;height:calc(100dvh - var(--barh,56px) - var(--tabh,42px) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px}
.pal{border-right:1px solid var(--rule-strong);background:var(--sheet);overflow:auto;padding:8px}
.pal h3,.props h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:10px 2px 6px;font-weight:800}
.pal h3:first-child,.props h3:first-child{margin-top:2px}
.palgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pitem{border:1px solid var(--rule);background:var(--field);border-radius:4px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--muted);touch-action:manipulation}
.pitem:hover{border-color:var(--accent);color:var(--ink)}
.pitem svg{width:56px;height:30px}
.stage{position:relative;overflow:hidden;background:#dfe5d8;min-width:0}
.stage svg#scene{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage svg#scene.panning{cursor:grabbing}
.ovl{position:absolute;pointer-events:none;color:#1d2328;font-family:Arial,Helvetica,sans-serif}
.ovl.compass{top:12px;right:12px}
.ovl.scale{left:12px;bottom:12px;font-size:11px;font-weight:700}
.tools{position:absolute;left:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 80px)}
.tools .btn{background:#fff;color:#1d2328;border-color:#9aa4a9;padding:4px 9px;font-size:12px}
.tools .btn[disabled]{opacity:.4}
.props{border-left:1px solid var(--rule-strong);background:var(--sheet);overflow:auto;padding:10px 12px 20px}
.frow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px;align-items:center;margin-bottom:6px}
.frow label{font-size:12px;color:var(--muted);font-weight:600}
.frow input[type=text],.frow input[type=number],.frow select{width:100%;border:1px solid var(--rule);background:var(--field);padding:4px 6px;border-radius:3px;min-width:0}
.frow input[type=range]{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.presets .btn{justify-content:center;font-size:12px;padding:5px 4px}
.presets .btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.leg{border:1px solid var(--rule);border-radius:4px;padding:7px 8px 4px;margin-bottom:8px;background:var(--field)}
.leg.off{opacity:.6}
.leg .lh{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;margin-bottom:6px}
.leg .lh .grow{flex:1}
.leg .g2{display:grid;grid-template-columns:1fr 1fr;gap:5px 6px}
.leg .g2 label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);font-weight:600;gap:1px;min-width:0}
.leg .g2 input,.leg .g2 select{border:1px solid var(--rule);background:var(--sheet);padding:3px 5px;border-radius:3px;width:100%;min-width:0;color:var(--ink)}
.leg .g2 .chk{flex-direction:row;align-items:center;gap:5px}
.leg .g2 .chk input{width:auto}
.turnrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:2px}
.leg .g2 .turnrow .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.leg .g2 .tlen{flex-direction:row;align-items:center;gap:6px;width:100%}
.leg .g2 .tlen input{width:80px}
.dz{padding:12px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;border:2px dashed transparent}
.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.dzrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dzrow label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dzrow select{border:1px solid var(--rule);background:var(--field);padding:5px 6px;border-radius:3px;max-width:100%}
.dzhint{margin:0;font-size:12.5px;color:var(--muted)}
.doc{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;padding:10px;border-top:1px solid var(--rule);align-items:start}
.dthumb{width:64px;height:64px;border:1px solid var(--rule);border-radius:4px;background:var(--field);display:flex;align-items:center;justify-content:center;overflow:hidden}
.dthumb img{width:100%;height:100%;object-fit:cover}
.ficon{font-family:var(--fm);font-weight:600;font-size:12px;color:var(--muted)}
.dname{font-weight:700;overflow-wrap:anywhere}
.dname-in{font-weight:700;border:0;border-bottom:1px dashed var(--rule);background:transparent;padding:2px 0;width:100%}
.dmeta{font-size:12px;color:var(--muted);margin:2px 0 6px}
.dfields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}
.dfields label{display:flex;flex-direction:column;gap:2px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.dfields .wide{grid-column:1/-1}
.dfields input,.dfields select{border:1px solid var(--rule);background:var(--field);padding:4px 6px;border-radius:3px;font-size:13.5px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);min-width:0;width:100%}
.dact{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.pwrow{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.pwrow input{border:1px solid var(--rule-strong);background:var(--field);padding:6px 8px;border-radius:4px;font-weight:400;color:var(--ink)}
@media (max-width:600px){.doc{grid-template-columns:48px minmax(0,1fr)}.dthumb{width:48px;height:48px}.dact{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.dfields{grid-template-columns:minmax(0,1fr)}}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:4px;border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--rule-strong)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.kbd{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px}
.dnotes{width:100%;border:1px solid var(--rule);background:var(--field);padding:6px;border-radius:3px;min-height:80px;resize:vertical}
.confirm{display:inline-flex;gap:5px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--band);color:var(--band-ink);padding:9px 16px;border-radius:5px;font-weight:600;z-index:60;max-width:calc(100% - 32px);font-size:13px}

@media (max-width:900px){
  .dg{grid-template-columns:1fr;height:auto}
  .pal{border-right:0;border-bottom:1px solid var(--rule-strong);overflow-x:auto;overflow-y:hidden;display:flex;gap:12px;padding:6px 10px}
  .pal section{flex:none}
  .palgrid{grid-template-columns:repeat(6,58px)}
  .stage{height:62vh}
  .props{border-left:0;border-top:1px solid var(--rule-strong)}
}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.s3,.s4{grid-column:1/-1}}
@media (max-width:440px){.grid{grid-template-columns:minmax(0,1fr)}.s2{grid-column:1/-1}.bar .btn .lbl-long{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="bar" id="bar">
  <button class="btn ghost" id="openCases" aria-label="Open saved investigations">☰ <span class="lbl-long">Cases</span></button>
  <div class="brand"><b>Internal Crash Investigation</b><span id="caseLine">New investigation</span></div>
  <div class="grow"></div>
  <span class="savestate" id="saveState">Not saved</span>
  <button class="btn ghost" id="btnSave">Save</button>
  <button class="btn ghost" id="btnDocx">Export Word</button>
  <button class="btn ghost" id="btnXlsx">Export Excel</button>
  <button class="btn primary" id="btnPng">Export diagram</button>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="view"></main>
<div id="drawerHost"></div>
<div id="toastHost"></div>
<input type="file" id="caseFile" accept=".json,application/json" hidden>
<input type="file" id="docFile" multiple hidden>

<script>
/* ==========================================================================
   FORM SCHEMA — edit labels, dropdown options and fields here.
   t: text | num | date | time | dt (date+time) | sel | area | chips | calc
   span: 1–4 grid columns. show(ctx): field appears only when it returns true.
   ========================================================================== */
const YNU = ['Yes','No','Unknown'];
const YN = ['Yes','No'];
const isCMV = c => c.s.f.fleet === 'Commercial motor vehicle (CMV)';
const isCo = c => (c.u?.role||'') === 'Company vehicle';
const CMVV = 'Commercial motor vehicle (CMV)';
const isVeh = c => !['Pedestrian','Cyclist'].includes(c.u?.role||'');
const unitCMV = c => c.u?.vclass===CMVV || (isCo(c)&&isCMV(c));      // this unit is a CMV (any party)
const coCMV = c => isCo(c) && (isCMV(c) || c.u?.vclass===CMVV);       // company CMV → 49 CFR section

const BODY_TYPES = [
  {g:'Light fleet', o:['Sedan','SUV','Pickup','Cargo van','Passenger van','Box truck (non-CDL)']},
  {g:'Commercial motor vehicle', o:['Tractor-trailer','Tractor (bobtail)','Straight truck','Tanker','Tank truck (straight)','Flatbed','Dump truck','Service / utility truck','Bus']},
  {g:'Other', o:['Farm tractor','Farm equipment / implement','Motorcycle','Bicycle','Pedestrian','Other']}
];

const SCHEMA = {
overview: [
  {h:'Case information'},
  {k:'caseNo', l:'Case no.', t:'text', span:2, hint:'unit no. – driver – date · fills in automatically, type to change, clear to rebuild'},
  {k:'fleet', l:'Fleet type', t:'sel', o:['Light fleet','Commercial motor vehicle (CMV)']},
  {k:'status', l:'Investigation status', t:'sel', o:['Open','Under review','Pending corrective action','Closed']},
  {k:'company', l:'Company / division', t:'sel', o:['Coastal Chemical Co. LLC','NSPEC']},
  {k:'crashDate', l:'Date of crash', t:'date'},
  {k:'crashTime', l:'Time of crash', t:'time'},
  {k:'reportedDate', l:'Date reported to company', t:'date'},
  {k:'reportedBy', l:'Reported by', t:'text'},
  {h:'Location'},
  {k:'street', l:'Street / highway', t:'text', span:2},
  {k:'cross', l:'Cross street / landmark', t:'text', span:2},
  {k:'city', l:'City', t:'text'},
  {k:'county', l:'County', t:'text'},
  {k:'state', l:'State', t:'text'},
  {k:'mile', l:'Mile marker / block', t:'text'},
  {k:'locType', l:'Location type', t:'sel', o:['Intersection','Straight roadway','Curve','Highway / interstate','On-ramp / off-ramp','Parking lot','Customer site / yard','Company facility','Private driveway','Railroad crossing','Work zone','Other']},
  {k:'gps', l:'GPS coordinates', t:'text', mono:1},
  {k:'onCompanyTime', l:'On company business', t:'sel', o:YNU},
  {k:'trip', l:'Trip purpose / route', t:'text'},
  {h:'Crash'},
  {k:'crashType', l:'Crash type', t:'sel', o:['Rear-end – struck other vehicle','Rear-end – struck by other vehicle','Angle / T-bone','Head-on','Sideswipe – same direction','Sideswipe – opposite direction','Left turn','Right turn','Backing','Lane change / merge','Struck parked vehicle','Fixed object','Rollover','Jackknife','Run off road','Pedestrian','Cyclist','Animal','Cargo / load shift','Other']},
  {k:'severity', l:'Severity', t:'sel', o:['Property damage only','Injury – treated at scene','Injury – treated away from scene','Fatality']},
  {k:'hitRun', l:'Hit and run', t:'sel', o:YN},
  {k:'firstHarm', l:'First harmful event', t:'text'},
  {h:'Law enforcement'},
  {k:'policeResp', l:'Police responded', t:'sel', o:YNU},
  {k:'agency', l:'Agency', t:'text'},
  {k:'policeNo', l:'Police report no.', t:'text', mono:1},
  {k:'officer', l:'Officer / badge', t:'text'},
  {h:'Emergency response & towing'},
  {k:'ems', l:'EMS responded', t:'sel', o:YNU},
  {k:'fire', l:'Fire dept. responded', t:'sel', o:YNU},
  {k:'tow', l:'Towing', t:'sel', o:['None','Company vehicle – disabling damage','Other vehicle – disabling damage','Both – disabling damage','Towed – not disabled']},
  {k:'towCo', l:'Tow company', t:'text'},
],
conditions: [

const pad = n => String(n).padStart(2,'0');
function newCaseNo(){const d=new Date();return `INV-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function blankUnit(role){return {role, damage:[], endorse:[]}}
function defaultRoad(){return presetRoad('4way')}
function blankState(){
  return {id:uid(), f:{caseNo:'', caseNoManual:false, fleet:'Light fleet', status:'Open', evidence:[], factors:[]},
    units:[blankUnit(''), blankUnit('')], witnesses:[], injured:[], actions:[], reviewers:[], property:[], attorneys:[], lhRequests:[], docs:[],
    diagram:{road:defaultRoad(), objects:[], notes:''}};
}
let S = blankState();
let tab = 'overview';
let dirty=false, everSaved=false, saving=false, saveAgain=false, saveTimer=null, lastSaved=null, userTouched=false;
let cases = [];          // [{id, caseNo, crashDate, street, fleet, status, updatedAt, state}]
let storeMode = 'pending';
let DB=null, DL=null;

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => n? n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}) : '$0';
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){a=a[ks[i]]??(a[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{})}a[ks[ks.length-1]]=v}

/* ==========================================================================
   DOT DETERMINATION (49 CFR 390.5 accident definition; 382.303 testing)
   ========================================================================== */
function crashDateTime(){
  const d=S.f.crashDate, t=S.f.crashTime; if(!d) return null;
  const dt=new Date(d+'T'+(t||'00:00')); return isNaN(dt)?null:dt;
}
function fmtDT(d){return d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function determination(){
  const f=S.f, cmv=f.fleet==='Commercial motor vehicle (CMV)';
  const fatal=f.severity==='Fatality' || S.injured.some(p=>p.treatment==='Fatal');
  const transported=f.severity==='Injury – treated away from scene' || S.injured.some(p=>/Transported|Self-transported|Admitted/.test(p.treatment||''));
  const towDisabled=/disabling/.test(f.tow||'');
  const citedCo=S.units.some(u=>u.role==='Company vehicle'&&u.cited==='Yes');
  const known=!!f.severity && !!f.tow;
  const recordable=fatal||transported||towDisabled;
  const test=fatal||(citedCo&&(transported||towDisabled));
  return {cmv,fatal,transported,towDisabled,citedCo,known,recordable,test};
}
function detHTML(){
  const d=determination(), f=S.f, out=[];
  const sev=f.severity||'Not entered';
  out.push(`<div><span class="k">Fleet</span><span class="v">${d.cmv?'CMV':'Light fleet'}</span><span class="n">${esc(f.status||'Open')}</span></div>`);
  if(f.lhStatus&&f.lhStatus!=='No hold') out.push(`<div><span class="k">Litigation hold</span><span class="v"><span class="pill ${f.lhStatus==='Hold issued – active'?'bad':'mut'}">${f.lhStatus==='Hold issued – active'?'Active – preserve all records':'Released'}</span></span><span class="n">${esc(f.lhMatter||'See the Litigation hold tab.')}</span></div>`);
  out.push(`<div><span class="k">Severity</span><span class="v">${esc(sev)}</span><span class="n">${S.units.length} unit${S.units.length===1?'':'s'} · ${S.injured.length} injured listed</span></div>`);
  if(d.cmv){
    const rec = !d.known&&!d.recordable ? '<span class="pill mut">Need severity & towing</span>' : d.recordable?'<span class="pill bad">DOT recordable</span>':'<span class="pill ok">Not recordable</span>';
    const why=[d.fatal&&'fatality',d.transported&&'injury treated away from scene',d.towDisabled&&'disabling tow-away'].filter(Boolean).join(', ');
    out.push(`<div><span class="k">DOT accident · 390.5</span><span class="v">${rec}</span><span class="n">${d.recordable?'Add to accident register (390.15): '+why:'No fatality, transported injury, or disabling tow-away entered.'}</span></div>`);
    let tn='';const ct=crashDateTime();
    if(d.test){
      tn = ct?`Alcohol by ${fmtDT(new Date(+ct+2*36e5))} (8 hr max ${fmtDT(new Date(+ct+8*36e5))}). Drug by ${fmtDT(new Date(+ct+32*36e5))}.`:'Enter crash date and time to see test deadlines.';
    } else tn = d.citedCo?'Citation alone does not trigger testing.':'Required for a fatality, or a citation to the company driver plus a transported injury or disabling tow.';
    out.push(`<div><span class="k">Post-accident testing · 382.303</span><span class="v">${d.test?'<span class="pill bad">Required</span>':'<span class="pill ok">Not required</span>'}</span><span class="n">${tn}</span></div>`);
  } else {
    const p=f.preventable;
    out.push(`<div><span class="k">Preventability</span><span class="v">${p?`<span class="pill ${p==='Preventable'?'bad':p==='Non-preventable'?'ok':'warn'}">${esc(p)}</span>`:'<span class="pill mut">Not determined</span>'}</span><span class="n">Set on the Analysis tab.</span></div>`);
  }
  return `<div class="det" id="det">${out.join('')}</div>${d.cmv?'<p class="note">DOT determinations follow 49 CFR 390.5 and 382.303 using what is entered on this form. Confirm with your designated employer representative before acting.</p>':''}`;
}

function optsHTML(o,v,ctx){
  const list = typeof o==='function'? o(ctx) : o;
  let h=`<option value="">—</option>`, found=!v;
  for(const it of list){
    if(typeof it==='object'){h+=`<optgroup label="${esc(it.g)}">`+it.o.map(x=>{if(x===v)found=true;return `<option${x===v?' selected':''}>${esc(x)}</option>`}).join('')+'</optgroup>'}
    else {if(it===v)found=true;h+=`<option${it===v?' selected':''}>${esc(it)}</option>`}
  }
  if(!found) h+=`<option selected>${esc(v)}</option>`;

function cellHTML(d,base,obj,ctx){
  const p=base+d.k, id='f-'+p.replace(/\./g,'_'), v=obj[d.k];
  const sp=d.span?` s${d.span}`:'', mono=d.mono?' mono':'';
  let c;
  switch(d.t){
    case 'sel': c=`<select id="${id}" data-p="${p}">${optsHTML(d.o,v||'',ctx)}</select>`;break;
    case 'area': c=`<textarea id="${id}" data-p="${p}" rows="${d.rows||3}">${esc(v)}</textarea>`;break;
    case 'num': c=`<input id="${id}" data-p="${p}" type="number" inputmode="decimal" step="any" value="${esc(v)}">`;break;
    case 'date': c=`<input id="${id}" data-p="${p}" type="date" value="${esc(v)}">`;break;
    case 'time': c=`<input id="${id}" data-p="${p}" type="time" value="${esc(v)}">`;break;
    case 'dt': c=`<input id="${id}" data-p="${p}" type="datetime-local" value="${esc(v)}">`;break;
    case 'dtna': {const na=v==='NA'; c=`<div class="na-row"><input id="${id}" data-p="${p}" type="datetime-local" value="${na?'':esc(v)}" ${na?'disabled':''} aria-label="${esc(d.l)}"><button type="button" class="btn sm" data-na="${p}" aria-pressed="${na}">${na?'✓ ':''}Not applicable</button></div>`;break;}
    case 'calc': return `<div class="cell calc${sp}"><span class="lbl">${esc(d.l)}</span><output id="${id}" data-calc="${base}${d.k}">${esc(d.calc(ctx))}</output></div>`;
    case 'list': {const arr=Array.isArray(v)&&v.length?v:[''];
      return `<div class="cell${sp}"><span class="lbl" id="${id}-l">${esc(d.l)}</span><div class="mlist" role="group" aria-labelledby="${id}-l">${arr.map((x,i)=>`<div class="mrow"><span class="mno">${i+1}.</span><input id="${id}_${i}" data-p="${p}.${i}" type="text" value="${esc(x)}" autocomplete="off" aria-label="${esc(d.l)} ${i+1}">${arr.length>1?`<button type="button" class="btn sm" data-listdel="${p}" data-i="${i}" aria-label="Remove ${esc(d.l)} ${i+1}">✕</button>`:''}</div>`).join('')}<button type="button" class="btn sm" data-listadd="${p}">${esc(d.add||'+ Add')}</button></div></div>`;}
    case 'chips': {const arr=Array.isArray(v)?v:[];
      return `<div class="cell${sp}"><span class="lbl" id="${id}-l">${esc(d.l)}</span><div class="chips" role="group" aria-labelledby="${id}-l">${d.o.map(x=>`<button type="button" class="chip" data-chip="${p}" data-v="${esc(x)}" aria-pressed="${arr.includes(x)}">${esc(x)}</button>`).join('')}</div></div>`;}
    default: c=`<input id="${id}" data-p="${p}" type="text" class="${mono}" value="${esc(v)}" autocomplete="off"${d.k==='caseNo'?' placeholder="Enter the company unit no., driver name and crash date"':''}>`;
  }

}
/* Renders a schema. Headings become dark bands (top level) or sub-bands (inside a repeat card). */
function schemaHTML(defs,base,obj,ctx,sub){
  let html='', open=false, skip=false;
  for(const d of defs){
    if(d.h){
      if(open){html+='</div>'+(sub?'':'</section>');open=false}
      skip = d.show && !d.show(ctx);
      if(skip) continue;
      html += sub? `<div class="subh">${esc(d.h)}</div><div class="grid">` : `<section class="sheet"><div class="band">${esc(d.h)}</div><div class="grid">`;
      open=true; continue;
    }
    if(skip) continue;
    if(d.show && !d.show(ctx)) continue;
    if(!open){html+= sub?'<div class="grid">':'<section class="sheet"><div class="grid">';open=true}
    html+=cellHTML(d,base,obj,ctx);
  }
  if(open) html+='</div>'+(sub?'':'</section>');
  return html;
}
function repeatHTML(listKey,defs,title,ctxFn){
  return S[listKey].map((it,i)=>{
    const ctx={s:S,u:it};
    return `<section class="sheet"><div class="band"><span>${title(it,i)}</span><span class="grow"></span>${delBtn(listKey,i)}</div>${schemaHTML(defs,`${listKey}.${i}.`,it,ctx,true)}</section>`;
  }).join('');
}
let pendingDel=null;
function delBtn(list,i){
  const key=list+':'+i;
  return pendingDel===key
    ? `<span class="confirm"><button class="btn sm" data-del="${key}" data-confirm="1">Confirm remove</button><button class="btn sm" data-cancel>Keep</button></span>`

}

    case 'lot': base.kind='lot'; base.legs=[L(90,{name:'Main St'}),L(270)]; break;

/* ---------- road geometry ---------- */
function legHalf(l,R){const m=l.center==='median'?l.median*FT/2:0;return {m,inW:m+l.lin*R.laneFt*FT,outW:m+l.lout*R.laneFt*FT,sh:l.shoulder?8*FT:0,tw:l.lin?((l.turnL?1:0)+(l.turnR?1:0))*R.laneFt*FT:0}}

function legStart(l,R,active){
  if(R.kind==='round') return R.ringR*FT+3*FT;
  const me=legHalf(l,R), Wi=Math.max(me.inW+me.tw,me.outW)+me.sh;
  let d=0, cross=0;
  for(const o of active){ if(o===l) continue; const th=angDiff(l.b,o.b); if(th>150) continue; cross++;
    const oh=legHalf(o,R), Wj=Math.max(oh.inW+oh.tw,oh.outW)+oh.sh, t=Math.max(20,th)*Math.PI/180;
    d=Math.max(d, Wj/Math.sin(t) + (th<90? Wi/Math.tan(t):0));
  }
  return cross? d+4*FT : 0;
}
function roadSVG(R){
  const LEN=700*FT, active=R.legs.filter(l=>l.on);

  const minHalf = active.length? Math.min(...active.map(l=>{const h=legHalf(l,R);return Math.min(h.inW,h.outW)})) : 0;
  if(R.kind==='lot'){
    const L=R.lot, W=L.w*FT, H=L.h*FT, x0=L.x*FT-W/2, y0=L.y*FT-H/2;
    base+=`<rect x="${n1(x0)}" y="${n1(y0)}" width="${n1(W)}" height="${n1(H)}" fill="${C.asphalt}" stroke="${C.curb}" stroke-width="3"/>`;
    const rows=Math.max(1,L.rows|0), sd=18*FT, aisle=24*FT, stallW=9*FT, n=Math.max(1,L.stalls|0);
    const totalH=rows*sd*2+(rows)*aisle; let y=y0+Math.max(6,(H-totalH)/2);
    const rowW=n*stallW, xs=x0+Math.max(6,(W-rowW)/2);
    for(let r=0;r<rows;r++){
      for(const side of [0,1]){const yy=y+side*sd; for(let i=0;i<=n;i++){const x=xs+i*stallW; mark+=`<line x1="${n1(x)}" y1="${n1(yy)}" x2="${n1(x)}" y2="${n1(yy+sd)}" stroke="${C.white}" stroke-width="1.3"/>`} }
      mark+=`<line x1="${n1(xs)}" y1="${n1(y+sd)}" x2="${n1(xs+rowW)}" y2="${n1(y+sd)}" stroke="${C.white}" stroke-width="1.3"/>`;
      y+=sd*2+aisle;
    }
  }
  for(const l of active){
    const h=legHalf(l,R), d0=legStart(l,R,active), a=l.b-90, s0=(R.kind==='round'?(R.ringR-R.ringLanes*R.laneFt)*FT:-Math.max(0,minHalf*0.0));
    const g=c=>`<g transform="rotate(${a})">${c}</g>`;
    let b='', m='', dv='';
    if(h.sh) shl+=g(`<rect x="${n1(s0)}" y="${n1(-h.inW-h.sh)}" width="${n1(LEN)}" height="${n1(h.inW+h.outW+2*h.sh)}" fill="${C.shoulder}"/>`);
    b+=`<rect x="${n1(s0)}" y="${n1(-h.inW)}" width="${n1(LEN)}" height="${n1(h.inW+h.outW)}" fill="${C.asphalt}"/>`;
    if(l.center==='median') med+=g(`<rect x="${n1(d0+4*FT)}" y="${n1(-h.m)}" width="${n1(LEN)}" height="${n1(2*h.m)}" rx="${n1(h.m)}" fill="${C.grass}" stroke="${C.curb}" stroke-width="1.5"/>`);
    const x1=d0, run=LEN-d0, LW=R.laneFt*FT, tw=h.tw, TL=Math.max(20,l.turnLen||100)*FT, xb=x1+TL, xc=xb+50*FT;
    const seg=(xa,ya,xz,yz,dash,col=C.white,sw=1.6)=>`<line x1="${n1(xa)}" y1="${n1(ya)}" x2="${n1(xz)}" y2="${n1(yz)}" stroke="${col}" stroke-width="${sw}"${dash?` stroke-dasharray="${10*FT} ${30*FT}"`:''}/>`;
    // turn-lane widening on the inbound side
    if(tw) b+=`<polygon points="${n1(x1-2)},${n1(-h.inW+1)} ${n1(x1-2)},${n1(-h.inW-tw)} ${n1(xb)},${n1(-h.inW-tw)} ${n1(xc)},${n1(-h.inW+1)}" fill="${C.asphalt}"/>`;
    // edge lines
    if(tw) m+=seg(x1,-h.inW-tw+1.5,xb,-h.inW-tw+1.5)+seg(xb,-h.inW-tw+1.5,xc,-h.inW+1.5)+seg(xc,-h.inW+1.5,LEN,-h.inW+1.5);
    else m+=`<line x1="${n1(x1)}" y1="${n1(-h.inW+1.5)}" x2="${LEN}" y2="${n1(-h.inW+1.5)}" stroke="${C.white}" stroke-width="1.6"/>`;
    m+=`<line x1="${n1(x1)}" y1="${n1(h.outW-1.5)}" x2="${LEN}" y2="${n1(h.outW-1.5)}" stroke="${C.white}" stroke-width="1.6"/>`;
    // center
    if(l.lin&&l.lout){
      if(l.center==='double') m+=`<line x1="${n1(x1)}" y1="-1.6" x2="${LEN}" y2="-1.6" stroke="${C.yellow}" stroke-width="1.5"/><line x1="${n1(x1)}" y1="1.6" x2="${LEN}" y2="1.6" stroke="${C.yellow}" stroke-width="1.5"/>`;
      else if(l.center==='dashed') m+=`<line x1="${n1(x1)}" y1="0" x2="${LEN}" y2="0" stroke="${C.yellow}" stroke-width="1.6" stroke-dasharray="${10*FT} ${30*FT}"/>`;
      else if(l.center==='twlt') m+=`<line x1="${n1(x1)}" y1="-1.6" x2="${LEN}" y2="-1.6" stroke="${C.yellow}" stroke-width="1.5"/><line x1="${n1(x1)}" y1="1.6" x2="${LEN}" y2="1.6" stroke="${C.yellow}" stroke-width="1.5"/>`;
      else if(l.center==='median') m+=`<line x1="${n1(x1)}" y1="${n1(-h.m-1.5)}" x2="${LEN}" y2="${n1(-h.m-1.5)}" stroke="${C.yellow}" stroke-width="1.5"/><line x1="${n1(x1)}" y1="${n1(h.m+1.5)}" x2="${LEN}" y2="${n1(h.m+1.5)}" stroke="${C.yellow}" stroke-width="1.5"/>`;
    }
    const off=(tw&&l.turnL)?LW:0;
    for(let i=1;i<l.lin;i++){const y=-h.m-i*LW;
      if(off) m+=seg(x1,y-off,xb,y-off,1,C.white,1.4)+seg(xb,y-off,xc,y,1,C.white,1.4)+seg(xc,y,LEN,y,1,C.white,1.4);
      else m+=`<line x1="${n1(x1)}" y1="${n1(y)}" x2="${LEN}" y2="${n1(y)}" stroke="${C.white}" stroke-width="1.4" stroke-dasharray="${10*FT} ${30*FT}"/>`}

    // crosswalk + stop line
    let sx=x1+2*FT;
    if(l.xwalk){const cw=10*FT, top=-h.inW-tw, bot=h.outW; for(let y=top+2;y<bot-2;y+=4*FT) m+=`<rect x="${n1(sx)}" y="${n1(y)}" width="${n1(cw)}" height="${n1(2*FT)}" fill="${C.white}"/>`; sx+=cw+4*FT;}
    if(l.lin && (l.ctrl==='stop'||l.ctrl==='signal')) m+=`<rect x="${n1(sx)}" y="${n1(-h.inW-tw+1)}" width="${n1(2*FT)}" height="${n1(h.inW+tw-h.m-1)}" fill="${C.white}"/>`;
    if(l.lin && l.ctrl==='yield'){for(let y=-h.inW-tw+2;y<-h.m-4;y+=3*FT) m+=`<polygon points="${n1(sx)},${n1(y+1.5*FT)} ${n1(sx+3*FT)},${n1(y)} ${n1(sx+3*FT)},${n1(y+3*FT)}" fill="${C.white}"/>`}
    // turn arrows painted in each turn lane (traffic travels toward −x; left is +y)
    if(tw){const arrow=(ax,ay,sg)=>`<path d="M${n1(ax+42)} ${n1(ay)} L${n1(ax+12)} ${n1(ay)} Q${n1(ax)} ${n1(ay)} ${n1(ax)} ${n1(ay+sg*9)}" fill="none" stroke="${C.white}" stroke-width="3"/><polygon points="${n1(ax)},${n1(ay+sg*17)} ${n1(ax-5)},${n1(ay+sg*9)} ${n1(ax+5)},${n1(ay+sg*9)}" fill="${C.white}"/>`;
      const xs=[sx+10*FT]; if(TL>=90*FT) xs.push(x1+TL*0.6);
      for(const ax of xs){ if(l.turnL) m+=arrow(ax,-h.m-LW/2,1); if(l.turnR) m+=arrow(ax,-h.m-off-l.lin*LW-LW/2,-1); }}
    // control device at roadside, right of inbound traffic (−y side)
    const devX=sx+5*FT, devY=-h.inW-tw-h.sh-9;
    if(l.lin && l.ctrl!=='none'){
      const t={stop:'stop',yield:'yield',signal:'signal'}[l.ctrl];
      dv+=`<g transform="translate(${n1(devX)} ${n1(devY)}) rotate(${-a})">${drawObj({t,w:t==='signal'?3:5.5,h:t==='signal'?7.5:5.5})}</g>`;
    }
    // road name
    if(l.name){const nx=d0+6*FT+l.name.length*3.4, norm=((a%360)+360)%360, flip=norm>90&&norm<270;
      labels+=g(`<text x="${n1(nx)}" y="${n1(h.outW+h.sh+14)}" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" fill="#37413f" ${flip?`transform="rotate(180 ${n1(nx)} ${n1(h.outW+h.sh+14)})"`:''}>${esc(l.name)}</text>`);}
    base+=g(b); mark+=g(m); dev+=g(dv);
  }
  // center patch (fills the intersection box)
  if(R.kind==='legs' && active.length>=2){
    const r=Math.max(...active.map(l=>{const h=legHalf(l,R);return Math.max(h.inW,h.outW)}));

    for(let i=1;i<R.ringLanes;i++) mark+=`<circle r="${n1(Ri+i*R.laneFt*FT)}" fill="none" stroke="${C.white}" stroke-width="1.4" stroke-dasharray="${6*FT} ${8*FT}"/>`;

    </g></svg>`;
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));

function fmtVal(d,v){
  if(v==null||v===''||(Array.isArray(v)&&!v.length)) return '';
  if(Array.isArray(v)) return d.t==='list'?v.filter(Boolean).map((x,i)=>`${i+1}. ${x}`).join('\n'):v.join(' · ');
  if(d.t==='date'&&/^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,m,dd]=v.split('-');return `${m}/${dd}/${y}`}
  if(d.t==='time'&&/^\d{2}:\d{2}/.test(v)){let [h,mi]=v.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(mi).padStart(2,'0')} ${ap}`}
  if(v==='NA'&&(d.t==='dtna'||d.t==='dt')) return 'Not applicable';
  if((d.t==='dt'||d.t==='dtna')&&/T/.test(v)){const [a,b]=v.split('T');return fmtVal({t:'date'},a)+' '+fmtVal({t:'time'},b)}
  if(d.t==='num'&&/^(cost|estimate)/.test(d.k)&&!isNaN(+v)) return money(+v);
  return String(v);
}

const IDB={p:null,
  open(){ if(this.p) return this.p; this.p=new Promise((res,rej)=>{ let r; try{ r=indexedDB.open('cri-docs',1); }catch(e){ rej(e); return; }
    r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); this.p.catch(()=>{this.p=null}); return this.p; },
  async run(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('files',mode), st=tx.objectStore('files'); let out; const rq=fn(st); if(rq) rq.onsuccess=()=>{out=rq.result};
    tx.oncomplete=()=>res(out); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); },
  put(k,v){ return this.run('readwrite',st=>st.put(v,k)); }, get(k){ return this.run('readonly',st=>st.get(k)); }, del(k){ return this.run('readwrite',st=>st.delete(k)); }
};

/* ---------- case-file packing: documents travel inside the file; optional password (AES-256-GCM) ---------- */
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function b64ToBytes(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function pwKey(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function sealText(text,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await pwKey(pw,salt),new TextEncoder().encode(text));
  return JSON.stringify({app:'crash-investigation-workbook',encrypted:true,v:1,salt:await blobToB64(new Blob([salt])),iv:await blobToB64(new Blob([iv])),data:await blobToB64(new Blob([ct]))});}
async function openText(obj,pw){const key=await pwKey(pw,b64ToBytes(obj.salt));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(obj.iv)},key,b64ToBytes(obj.data));return new TextDecoder().decode(pt)}

/* Saves a file: through the Claude viewer when hosted there, otherwise a normal browser download. */
async function saveFile(filename,blob){
  if(DL){
    try{ await DL.save({filename,data:blob}); return true; }
    catch(err){ if(err?.code==='declined') return false; throw err; }
  }
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); return true;
}

    const existing=cases.find(c=>c.id===st.id);
    cases=[{id:st.id,caseNo:st.f.caseNo||'',crashDate:st.f.crashDate||'',street:st.f.street||'',fleet:st.f.fleet||'',status:st.f.status||'',updatedAt:Date.now(),state:st},...cases.filter(c=>c.id!==st.id)];

}

/* ==========================================================================
   SAVING — shared case database when available, this browser otherwise
   ========================================================================== */
function touch(){ dirty=true; userTouched=true; setSaveState(); clearTimeout(saveTimer); saveTimer=setTimeout(save,2500); }
function setSaveState(txt){
  const el=document.getElementById('saveState');
  if(txt){el.textContent=txt;return}
  if(storeMode==='pending'){el.textContent='Connecting…';return}
  if(saving){el.textContent='Saving…';return}
  if(dirty){el.textContent='Unsaved changes';return}
  el.textContent= lastSaved? `Saved ${lastSaved.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${storeMode==='local'?' · this browser':''}` : (storeMode==='local'?'Saves to this browser':'Not saved');
}
function docOf(){return {caseNo:S.f.caseNo||'',crashDate:S.f.crashDate||'',street:S.f.street||'',fleet:S.f.fleet||'',status:S.f.status||'',updatedAt:Date.now(),state:JSON.parse(JSON.stringify(S))}}
async function save(){
  clearTimeout(saveTimer);
  if(storeMode==='pending'){saveTimer=setTimeout(save,1500);return}
  if(saving){saveAgain=true;return}
  if(!dirty) {setSaveState();return}
  saving=true; dirty=false; setSaveState();
  const doc=docOf();
  try{
    if(storeMode==='db') await DB.collection('cases').doc(S.id).set(doc);
    else { const all=localCases(); all[S.id]=doc; localStorage.setItem('cri.cases',JSON.stringify(all)); refreshLocal(); }
    everSaved=true; lastSaved=new Date();
  }catch(err){
    dirty=true; setSaveState(err?.code==='permission_denied'?'You can view but not save this case':'Save failed — retrying'); saving=false;
    if(err?.code!=='permission_denied') saveTimer=setTimeout(save,6000); return;
  }
  saving=false; if(saveAgain){saveAgain=false; if(dirty) return save();} setSaveState();
}
function localCases(){try{return JSON.parse(localStorage.getItem('cri.cases')||'{}')}catch(_){return {}}}
function refreshLocal(){const all=localCases();cases=Object.entries(all).map(([id,d])=>({id,...d})).sort((a,b)=>b.updatedAt-a.updatedAt);renderDrawer(false)}
function openCase(id){
  const c=cases.find(x=>x.id===id); if(!c) return;
  S=JSON.parse(JSON.stringify(c.state)); S.id=id;
  if(S.f.caseNoManual===undefined) S.f.caseNoManual=!!S.f.caseNo;
  if(S.f.citations&&!Array.isArray(S.f.citations)&&typeof S.f.citations==='object') S.f.citations=Object.keys(S.f.citations).sort((a,b)=>a-b).map(k=>S.f.citations[k]);
  if(S.f.citationDetail && !Array.isArray(S.f.citations)){S.f.citations=[S.f.citationDetail];delete S.f.citationDetail}
  // cases saved before citations moved to each driver
  if(S.f.citation!==undefined||S.f.citations!==undefined){
    const co=S.units.find(u=>u.role==='Company vehicle'), ot=S.units.find(u=>u.role&&u.role!=='Company vehicle');
    const who=S.f.citation||'', list=(S.f.citations||[]).filter(Boolean);
    const mark=(u,v)=>{ if(u){ u.cited=u.cited||v; } };
    if(who==='Company driver'||who==='Both drivers') mark(co,'Yes');
    if(who==='Other driver'||who==='Both drivers') mark(ot,'Yes');
    if(who==='Pending') mark(co,'Pending');
    if(who==='None'){ mark(co,'No'); mark(ot,'No'); }
    if(list.length){ const tgt=(who==='Other driver'?ot:co)||ot||S.units[0]; if(tgt){ tgt.citations=(tgt.citations||[]).concat(list); tgt.cited=tgt.cited||'Yes'; } }
    delete S.f.citation; delete S.f.citations;
  }
  S.witnesses??=[];S.injured??=[];S.actions??=[];S.reviewers??=[];S.property??=[];S.attorneys??=[];S.lhRequests??=[];S.docs??=[];S.units??=[];S.diagram??={road:defaultRoad(),objects:[],notes:''};
  dirty=false; everSaved=true; userTouched=false; lastSaved=new Date(c.updatedAt); Dg.sel=null; Dg.undo=[]; Dg.redo=[];
  setSaveState(); renderTab(); closeDrawer();
}
async function startNew(){ if(dirty) await save(); S=blankState(); dirty=false; everSaved=false; userTouched=false; lastSaved=null; Dg.sel=null; Dg.undo=[]; tab='overview'; renderTabs(); renderTab(); setSaveState(); closeDrawer(); }
async function deleteCase(id){
  const victim=cases.find(c=>c.id===id)?.state||(id===S.id?S:null);
  for(const d of (victim?.docs||[])) if(d.stored) IDB.del(id+'/'+d.id).catch(()=>{});
  try{ if(storeMode==='db') await DB.collection('cases').doc(id).delete(); else {const all=localCases();delete all[id];localStorage.setItem('cri.cases',JSON.stringify(all));refreshLocal()} }
  catch(err){toast('Could not delete: '+(err?.message||err?.code||''));return}
  if(id===S.id){S=blankState();dirty=false;everSaved=false;lastSaved=null;renderTab();setSaveState()}
  toast('Case deleted.');
}

/* drawer */
let drawerOpen=false, pendingCaseDel=null;
function openDrawer(){drawerOpen=true;renderDrawer(true)}
function closeDrawer(){drawerOpen=false;pendingCaseDel=null;document.getElementById('drawerHost').innerHTML=''}
function renderDrawer(focus){
  if(!drawerOpen) return;
  const pill=s=>`<span class="pill ${s==='Closed'?'ok':s==='Open'?'warn':'mut'}">${esc(s||'Open')}</span>`;
  const list=cases.length? cases.map(c=>`<div class="caserow${c.id===S.id?' cur':''}" role="button" tabindex="0" data-open="${c.id}">
      <span class="no">${esc(c.caseNo||'Untitled')}</span>${pill(c.status)}
      <span class="meta">${esc([c.crashDate,c.street,c.fleet==='Commercial motor vehicle (CMV)'?'CMV':c.fleet].filter(Boolean).join(' · ')||'No details yet')}</span>
      <span class="meta">Updated ${new Date(c.updatedAt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
        ${pendingCaseDel===c.id?`<span class="confirm" style="float:right"><button class="btn sm danger" data-cdel="${c.id}" data-confirm="1">Delete case</button><button class="btn sm" data-ckeep>Keep</button></span>`:`<button class="btn sm" style="float:right" data-cdel="${c.id}">Delete</button>`}</span>
    </div>`).join('') : `<div class="empty">${storeMode==='pending'?'Loading saved cases…':'No saved investigations yet. Cases save automatically as you fill them in.'}</div>`;
  document.getElementById('drawerHost').innerHTML=`<div class="drawer" id="drawer"><div class="panel" role="dialog" aria-modal="true" aria-label="Saved investigations">
    <div style="display:flex;align-items:center;gap:8px"><h2>Investigations</h2><span style="flex:1"></span><button class="btn sm" id="dClose">Close</button></div>
    <button class="btn primary" id="dNew">+ New investigation</button>
    <label class="pwrow" for="casePw">Case file password<input type="password" id="casePw" autocomplete="new-password" placeholder="Recommended — required to open the file"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="dExportCase">Save case file</button><button class="btn" id="dImportCase">Open case file</button></div>
    <p class="note" style="margin:0">Give the password to the other person separately — by phone or text, never in the same email as the file. A lost password cannot be recovered.</p>
    <p class="note" style="margin:0">A case file (.json) holds the whole investigation, diagram included. Email it or store it on a shared drive, and anyone can open it here to keep working.</p>
    ${storeMode==='local'?'<p class="note" style="margin:0">Cases save automatically in this browser on this computer. Use Save case file to keep a copy or pass a case to someone else.</p>':storeMode==='db'?'<p class="note" style="margin:0">Cases are shared with everyone who can open this workbook.</p>':''}
    <div class="caselist">${list}</div></div></div>`;
  if(focus) document.getElementById('dNew')?.focus();
}
document.getElementById('drawerHost').addEventListener('click',e=>{
  if(e.target.id==='drawer'||e.target.id==='dClose'){closeDrawer();return}
  if(e.target.id==='dNew'){startNew();return}
  if(e.target.id==='dExportCase'){exportCase();return}
  if(e.target.id==='dImportCase'){document.getElementById('caseFile').click();return}
  const del=e.target.closest('[data-cdel]');
  if(del){e.stopPropagation(); if(del.dataset.confirm){pendingCaseDel=null;deleteCase(del.dataset.cdel);} else pendingCaseDel=del.dataset.cdel; renderDrawer(); return}
  if(e.target.closest('[data-ckeep]')){pendingCaseDel=null;renderDrawer();return}
  const row=e.target.closest('[data-open]'); if(row){ if(dirty) save(); openCase(row.dataset.open); }
});
document.getElementById('drawerHost').addEventListener('keydown',e=>{
  if(e.key==='Escape')closeDrawer();
  if(e.key==='Enter'&&e.target.dataset?.open){openCase(e.target.dataset.open)}
});

function toast(msg){const h=document.getElementById('toastHost');h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',3200)}

/* header buttons */
document.getElementById('openCases').onclick=openDrawer;
document.getElementById('btnSave').onclick=()=>{dirty=true;save()};
document.getElementById('btnXlsx').onclick=exportXLSX;
document.getElementById('btnDocx').onclick=exportDOCX;
document.getElementById('btnPng').onclick=exportPNG;
document.getElementById('docFile').addEventListener('change',e=>{const fs=[...e.target.files]; e.target.value=''; if(fs.length) addDocs(fs);});
document.getElementById('caseFile').addEventListener('change',e=>{const f=e.target.files[0]; if(f) importCase(f); e.target.value='';});

/* sticky offsets */
function measure(){const b=document.getElementById('bar').offsetHeight,t=document.getElementById('tabs').offsetHeight;document.documentElement.style.setProperty('--barh',b+'px');document.documentElement.style.setProperty('--tabh',t+'px')}
new ResizeObserver(measure).observe(document.getElementById('bar'));

/* ==========================================================================
   BOOT
   ========================================================================== */
try{const t=localStorage.getItem('cri.tab');if(t&&TABS.some(x=>x[0]===t))tab=t}catch(_){}
renderTabs(); renderTab(); measure(); setSaveState();

(async()=>{
  const use = window.claude?.use ? n=>window.claude.use(n).catch(()=>null) : async()=>null;
  const [db,dl]=await Promise.all([use('db'),use('downloads')]);
  DB=db; DL=dl;
  if(DB){
    storeMode='db';
    let first=true;
    DB.collection('cases').orderBy('updatedAt','desc').onSnapshot(snap=>{
      cases=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(first){first=false; if(!userTouched && !everSaved && cases.length) openCase(cases[0].id);}
      renderDrawer(false); updateHeader(); setSaveState();
    },err=>{setSaveState('Could not load saved cases');});
  } else {
    storeMode='local'; refreshLocal();
    if(!userTouched && cases.length) openCase(cases[0].id);
  }
  updateHeader(); setSaveState(); if(dirty) save();
})();
</script>
